<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai aur code </title>
</head>
<body style="background-color: #212121; color: #ffff;">
    
</body>
<script>
    const div = document.createElement('div') // creates an element with the specified tag name.
    console.log(div);
    div.className = "main";
    // div.id = "myID";
    div.id = Math.round(Math.random() * 10 + 1);
    div.setAttribute("title", "generated title"); // sets the value of an attribute on the specified element. if the attribute already exists, the value is updated; otherwise a new attribute is added with the specified name and value. first parameter is the name of the attribute and the second parameter is the value of the attribute.
    div.style.backgroundColor = "green";
    div.style.padding = "12px";
    // div.innerText = "Chai aur code"

        // setAttribute() vs innerText --->
        //     setAttribute() directly adds the text to the element.
        //     innerText creates a text node first and then adds it to the element.

        //     so innerText is a two step process. whereas setAttribute() is a one step process.
        
    const addText = document.createTextNode("Chai aur code"); // creates a text node.

    // up till now a text with etc etc has been created but it has not been added to the DOM. It is saved in memory. so we need to add it to the DOM.


    div.appendChild(addText); // appends a node as the last child of a node in div.

    document.body.appendChild(div); // appends a node as the last child of a node in body.
</script>
</html>
