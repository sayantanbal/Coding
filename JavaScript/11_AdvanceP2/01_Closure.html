    <script>

    // CLOSURE
    // closure is a combination of a function and the lexical environment within which that function was declared. this environment consists of any local variables that were in scope at the time the closure was created.

    
        // document.getElementById("orange").onclick = function(){
        //     document.body.style.backgroundColor = `orange`
        // }
        // document.getElementById("green").onclick = function(){
        //     document.body.style.backgroundColor = `green`
        // }

        function clickHandler(color){
            // document.body.style.backgroundColor = `${color}`// if you do this then it will change the color of the body as soon as the page loads. because * but we want it to change only when we click the button. so we will return a function from here and then we will call it when we click the button.

            return function(){
                document.body.style.backgroundColor = `${color}`
            }
        }

        document.getElementById('orange').onclick = clickHandler("orange") // *we were expecting to return a function but we executed the func. so its shwows the color as soon as the page loads.
        document.getElementById('green').onclick = clickHandler("green")

    </script>
